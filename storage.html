<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Video & Audio Recorder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .video-container {
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
        }
        .recording-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .audio-bar {
            transition: height 0.1s ease-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="max-w-4xl w-full space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-white">Drive AV Recorder</h1>
            <p class="text-gray-400">Capture high-quality video and audio directly to your Google Drive</p>
        </div>

        <!-- Configuration Warning -->
        <div id="config-warning" class="bg-amber-900/30 border border-amber-500/50 p-4 rounded-lg text-amber-200 text-sm mb-4">
            <p><strong>Setup Required:</strong> You must edit the code to add your <strong>Client ID</strong> and <strong>API Key</strong>. Without these, the "Save to Drive" feature will not work.</p>
        </div>

        <!-- Main Interface -->
        <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
            <div class="video-container shadow-2xl mb-6">
                <video id="preview" autoplay muted playsinline class="w-full h-full object-cover"></video>
                
                <!-- Status Indicators -->
                <div id="recording-indicator" class="hidden absolute top-4 right-4 flex items-center gap-2 bg-red-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider z-10">
                    <div class="w-2 h-2 bg-white rounded-full recording-pulse"></div>
                    Recording: <span id="timer">00:00</span> / 05:00
                </div>

                <!-- Audio Visualizer -->
                <div class="absolute bottom-4 left-4 flex items-end gap-1 h-8 px-2 py-1 bg-black/40 rounded-lg backdrop-blur-sm">
                    <div id="bar1" class="audio-bar w-1 bg-blue-400 rounded-full h-1"></div>
                    <div id="bar2" class="audio-bar w-1 bg-blue-400 rounded-full h-1"></div>
                    <div id="bar3" class="audio-bar w-1 bg-blue-400 rounded-full h-1"></div>
                    <div id="bar4" class="audio-bar w-1 bg-blue-400 rounded-full h-1"></div>
                    <span class="text-[10px] text-blue-200 ml-1 font-bold uppercase">Audio</span>
                </div>
            </div>

            <div class="flex flex-wrap justify-center gap-4">
                <button id="start-btn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-full font-semibold transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                    Start Recording
                </button>

                <button id="stop-btn" disabled class="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white px-6 py-3 rounded-full font-semibold transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="10" height="10" x="7" y="7" rx="2"/></svg>
                    Stop Recording
                </button>

                <button id="save-btn" disabled class="flex items-center gap-2 bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-full font-semibold transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                    Save to Google Drive
                </button>
            </div>
        </div>

        <!-- Status & Logs -->
        <div id="status-container" class="hidden bg-gray-800 border border-gray-700 p-4 rounded-xl">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">System Status</h3>
            <div id="status-message" class="text-sm text-gray-300">Initializing...</div>
            <div id="progress-bar-container" class="hidden mt-3 w-full bg-gray-700 rounded-full h-2">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- UI Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-6 rounded-xl max-w-sm w-full border border-gray-700">
            <h2 id="modal-title" class="text-xl font-bold mb-2 text-white"></h2>
            <p id="modal-body" class="text-gray-400 mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-blue-600 py-2 rounded-lg font-bold hover:bg-blue-500">Close</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CLIENT_ID = '1066311652026-vndvdrqgvf18epoe2rlodhkesubn0u4p.apps.googleusercontent.com'; 
        const API_KEY = 'AIzaSyAAwh9oVNej8flePAOZTkzO3_BqKuuuock';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        // ---------------------

        let mediaRecorder;
        let recordedChunks = [];
        let startTime;
        let timerInterval;
        let stream;
        let audioContext;
        let analyser;
        let dataArray;
        let animationFrame;
        let tokenClient;
        let accessToken = null;
        let blob;

        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const saveBtn = document.getElementById('save-btn');
        const timerDisplay = document.getElementById('timer');
        const indicator = document.getElementById('recording-indicator');
        const statusBox = document.getElementById('status-container');
        const statusMsg = document.getElementById('status-message');

        window.onload = () => {
            if (CLIENT_ID === 'YOUR_CLIENT_ID') {
                console.warn("Google Drive credentials not set.");
            } else {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (response) => {
                        if (response.error !== undefined) {
                            showModal('Auth Error', 'Could not authenticate with Google.');
                            return;
                        }
                        accessToken = response.access_token;
                        performUpload();
                    },
                });
                document.getElementById('config-warning').classList.add('hidden');
            }
            setupMedia();
        };

        async function setupMedia() {
            try {
                // Request BOTH audio and video
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                
                preview.srcObject = stream;
                setupAudioVisualizer(stream);
                updateStatus("Camera and Microphone ready.");
            } catch (err) {
                updateStatus("Error: " + err.message);
                showModal('Permission Error', 'This app needs access to your camera AND microphone to record both audio and video.');
            }
        }

        function setupAudioVisualizer(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 32;
            source.connect(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            function draw() {
                animationFrame = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
                for (let i = 0; i < bars.length; i++) {
                    const value = dataArray[i] / 255;
                    const height = Math.max(4, value * 32);
                    bars[i].style.height = `${height}px`;
                    // Color shifts to green/red based on volume
                    bars[i].style.backgroundColor = value > 0.8 ? '#ef4444' : (value > 0.5 ? '#f59e0b' : '#60a5fa');
                }
            }
            draw();
        }

        startBtn.addEventListener('click', () => {
            recordedChunks = [];
            // Specify container and codecs for both AV
            const options = { mimeType: 'video/webm; codecs=vp9,opus' };
            
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                // Fallback for browsers that don't support VP9/Opus specifically
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                // The blob now contains both tracks
                blob = new Blob(recordedChunks, { type: 'video/webm' });
                saveBtn.disabled = false;
                updateStatus("AV Recording finished. Ready to save.");
            };

            mediaRecorder.start();
            startTime = Date.now();
            startTimer();
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;
            indicator.classList.remove('hidden');
            updateStatus("Recording Video + Audio...");
        });

        stopBtn.addEventListener('click', stopRecording);

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            clearInterval(timerInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            indicator.classList.add('hidden');
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const seconds = Math.floor(elapsed / 1000);
                const minutes = Math.floor(seconds / 60);
                const displaySecs = (seconds % 60).toString().padStart(2, '0');
                const displayMins = minutes.toString().padStart(2, '0');
                
                timerDisplay.innerText = `${displayMins}:${displaySecs}`;

                if (seconds >= 300) {
                    stopRecording();
                    showModal('Limit Reached', 'Recording stopped at the 5-minute limit.');
                }
            }, 1000);
        }

        saveBtn.addEventListener('click', () => {
            if (CLIENT_ID === 'YOUR_CLIENT_ID') {
                showModal('Configuration Required', 'Please set your Client ID and API Key in the code configuration section.');
                return;
            }
            
            if (!accessToken) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                performUpload();
            }
        });

        async function performUpload() {
            updateStatus("Uploading AV file to Drive...");
            document.getElementById('progress-bar-container').classList.remove('hidden');
            saveBtn.disabled = true;

            const metadata = {
                name: `AV_Recording_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`,
                mimeType: 'video/webm',
                description: 'Recorded using Drive AV Recorder Web App'
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', blob);

            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form,
                });

                if (response.ok) {
                    const result = await response.json();
                    updateStatus("Success! Video and Audio saved to Drive.");
                    showModal('Saved!', 'Your video (with audio) has been successfully uploaded to your Google Drive.');
                } else {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'Upload failed');
                }
            } catch (error) {
                updateStatus("Error: " + error.message);
                showModal('Upload Failed', error.message);
                saveBtn.disabled = false;
            } finally {
                document.getElementById('progress-bar-container').classList.add('hidden');
            }
        }

        function updateStatus(msg) {
            statusBox.classList.remove('hidden');
            statusMsg.innerText = msg;
        }

        function showModal(title, body) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
